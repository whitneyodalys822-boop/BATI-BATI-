<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bati Bati · Batidos y frescos naturales</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;800&display=swap">
<style>
:root{
  --amarillo:#F0AE1E; --verde:#1F5C32; --verde-osc:#16401f; --fresa:#E8553A; --arandano:#5B68C0;
  --fondo:#F6F1DE; --tarjeta:#FFFBEA; --texto:#2a2a1e; --suave:#5d5a44; --linea:#e6dcb4;
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--fondo:#1d1b12;--tarjeta:#2a2718;--texto:#f6efd8;--suave:#cfc7a4;--linea:#42391c;color-scheme:dark}
}
:root[data-theme="dark"]{--fondo:#1d1b12;--tarjeta:#2a2718;--texto:#f6efd8;--suave:#cfc7a4;--linea:#42391c;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--fondo);color:var(--texto);font-family:'Nunito',system-ui,sans-serif;font-size:1.05rem;line-height:1.6}
h1,h2,h3{font-family:'Fredoka','Nunito',sans-serif;line-height:1.1;margin:0}
a{color:inherit}
:focus-visible{outline:3px solid var(--arandano);outline-offset:3px}
.wrap{max-width:980px;margin:0 auto;padding:0 20px}

/* HERO */
.hero{background:var(--amarillo);color:var(--verde-osc);position:relative;overflow:hidden;padding:56px 0 90px;text-align:center}
.hero .wrap{position:relative;z-index:1}
.hero h1{font-size:clamp(4rem,19vw,9.5rem);font-weight:700;letter-spacing:-.02em;color:var(--verde-osc)}
.hero h1 span{display:block}
.hero h1 span+span{color:#FFFBEA;-webkit-text-stroke:0}
.hero p.lema{font-size:clamp(1.15rem,3.6vw,1.5rem);font-weight:800;max-width:30ch;margin:18px auto 28px}
.btn{display:inline-block;font-family:'Fredoka',sans-serif;font-weight:600;font-size:1.15rem;text-decoration:none;padding:14px 28px;border-radius:999px;background:var(--verde);color:#FFFBEA;border:3px solid var(--verde);transition:transform .15s}
.btn:hover{transform:translateY(-2px)}
.btn.sec{background:transparent;color:var(--verde-osc);border-color:var(--verde-osc);margin-left:8px}
.bola{position:absolute;border-radius:50%;opacity:.95}
.b1{width:120px;height:120px;background:var(--arandano);left:-30px;top:40px}
.b2{width:90px;height:90px;background:var(--fresa);right:6%;top:30px}
.b3{width:150px;height:150px;background:var(--verde);right:-40px;bottom:40px}
.b4{width:70px;height:70px;background:var(--arandano);left:8%;bottom:20px}
.ola{position:absolute;left:0;right:0;bottom:-1px;height:50px;background:var(--fondo);border-radius:50% 50% 0 0/100% 100% 0 0}

/* SECCIONES */
section{padding:56px 0}
h2{font-size:clamp(2rem,6vw,3rem);color:var(--verde);text-align:center}
:root[data-theme="dark"] h2{color:var(--amarillo)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) h2{color:var(--amarillo)}}
.intro{text-align:center;max-width:52ch;margin:12px auto 36px;color:var(--suave)}
.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}
.bebida{background:var(--tarjeta);border:2px solid var(--linea);border-radius:24px;padding:20px;display:flex;gap:16px;align-items:center}
.ico{flex:none;width:62px;height:62px;border-radius:50%;display:grid;place-items:center;font-size:1.9rem}
.bebida h3{font-size:1.3rem}
.bebida p{margin:2px 0 0;font-size:.95rem;color:var(--suave);line-height:1.35}
.precio{margin-left:auto;font-family:'Fredoka',sans-serif;font-weight:700;font-size:1.25rem;color:var(--fresa);white-space:nowrap}
.nota{text-align:center;color:var(--suave);margin-top:24px;font-size:.95rem}

.natural{background:var(--verde);color:#FFFBEA}
.natural h2{color:var(--amarillo)}
.puntos{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px;margin-top:32px;text-align:center}
.puntos div{padding:8px}
.puntos .e{font-size:2.2rem}
.puntos h3{font-size:1.25rem;margin:6px 0 4px;color:var(--amarillo)}
.puntos p{margin:0;font-size:.98rem}

.visita .tarjeta{background:var(--tarjeta);border:2px solid var(--linea);border-radius:28px;padding:32px;margin-top:28px;display:grid;gap:24px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.dato h3{font-size:1.15rem;color:var(--fresa);margin-bottom:4px}
.dato p{margin:0}
.cta{text-align:center;margin-top:30px}

footer{background:var(--verde-osc);color:#FFFBEA;text-align:center;padding:32px 20px;font-size:.95rem}
footer a{font-weight:800;margin:0 8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
@media (max-width:520px){.btn.sec{margin:12px 0 0}}
</style>
</head>
<body>

<header class="hero">
  <i class="bola b1"></i><i class="bola b2"></i><i class="bola b3"></i><i class="bola b4"></i>
  <div class="wrap">
    <h1 aria-label=""><span id="n1"></span><span id="n2"></span></h1>
    <p class="lema" id="lema"></p>
    <a class="btn" href="#visitanos" id="btnVisita"></a><a class="btn sec" href="#menu">Ver bebidas</a>
  </div>
  <div class="ola"></div>
</header>

<main>
  <section id="menu">
    <div class="wrap">
      <h2 id="tMenu"></h2>
      <p class="intro" id="introMenu"></p>
      <div class="menu" id="listaMenu"></div>
      <p class="nota" id="notaMenu"></p>
    </div>
  </section>

  <section class="natural">
    <div class="wrap">
      <h2 id="tNatural"></h2>
      <div class="puntos" id="puntos"></div>
    </div>
  </section>

  <section class="visita" id="visitanos">
    <div class="wrap">
      <h2 id="tVisita"></h2>
      <p class="intro" id="introVisita"></p>
      <div class="tarjeta" id="datos"></div>
      <div class="cta"><a class="btn" id="btnMapa" target="_blank" rel="noopener"></a></div>
    </div>
  </section>
</main>

<footer>
  <div id="redes"></div>
  <p id="pie" style="margin:10px 0 0"></p>
</footer>

<script>
/* ============================================================
   ✏️  EDITA AQUÍ TUS DATOS
   Cambia solo el texto que está entre comillas "..."
   Todo lo demás de la página se actualiza solo.
   ============================================================ */
const DATOS = {

  // --- Encabezado ---
  nombre1: "BATI",
  nombre2: "BATI",
  lema: "Batidos y frescos 100% naturales. ¡Ven al puesto y pruébalos!",
  textoBotonVisita: "Visítanos",

  // --- Menú ---
  tituloMenu: "Nuestras bebidas",
  introMenu: "Hechas al momento, con ingredientes naturales y mucho sabor.",
  moneda: "C$",            // símbolo de moneda
  notaMenu: "Pregunta en el puesto por los tamaños disponibles.",
  bebidas: [
    // icono = emoji | color = fondo del icono | precio = solo el número
    { icono:"🍌", color:"#F7D55C", nombre:"Banano con leche",   detalle:"Cremoso y dulce",             precio:"30" },
    { icono:"🥕", color:"#F6A55A", nombre:"Zanahoria",          detalle:"Dulce y natural",             precio:"30" },
    { icono:"🍈", color:"#F9B97A", nombre:"Melón",              detalle:"Fresco y ligero",             precio:"25" },
    { icono:"🌾", color:"#EBDDB0", nombre:"Avena con leche",    detalle:"Nutritiva y reconfortante",   precio:"30" },
    { icono:"🍊", color:"#F9C26A", nombre:"Fresco de naranja",  detalle:"Cítrico y bien frío",         precio:"20" },
    { icono:"🌱", color:"#A9D18E", nombre:"Linaza",             detalle:"Natural y saludable",         precio:"20" },
    { icono:"🌺", color:"#F2877A", nombre:"Jamaica",            detalle:"Ácida, fresca y vibrante",    precio:"20" }
  ],

  // --- Sección "Natural" ---
  tituloNatural: "Naturales de verdad",
  puntos: [
    { icono:"🥭", titulo:"Frutas y semillas",  texto:"Ingredientes naturales, sin complicaciones." },
    { icono:"🥤", titulo:"Hecho al momento",   texto:"Tu bebida se prepara cuando la pides." },
    { icono:"🌿", titulo:"Sabor de casa",      texto:"Recetas tradicionales y frescas todos los días." }
  ],

  // --- Cómo encontrarnos ---
  tituloVisita: "Encuentra nuestro puesto",
  introVisita: "Aquí no vendemos en línea: te esperamos en persona con tu bebida bien fría.",
  direccion: "INATEC Juan de Dios Muñoz Reyes, León, Nicaragua",
  referencia: "",
  horario: "Lunes a sábado: 8:00 am – 3:00 pm",
  telefono: "+505 7710 9557",
  textoBotonMapa: "Cómo llegar",
  enlaceMapa: "",          // Pega aquí el enlace de Google Maps (opcional)

  // --- Redes sociales (deja "" para ocultar) ---
  redes: [
    { nombre:"Instagram", url:"" },
    { nombre:"Facebook",  url:"" },
    { nombre:"WhatsApp",  url:"" }
  ],
  pie: "© Bati Bati · Batidos y frescos naturales"
};
/* ============================ FIN DE LOS DATOS ============================ */

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const D = DATOS;

$('n1').textContent = D.nombre1;
$('n2').textContent = D.nombre2;
document.querySelector('h1').setAttribute('aria-label', (D.nombre1 + ' ' + D.nombre2));
$('lema').textContent = D.lema;
$('btnVisita').textContent = D.textoBotonVisita;
$('tMenu').textContent = D.tituloMenu;
$('introMenu').textContent = D.introMenu;
$('notaMenu').textContent = D.notaMenu;
$('tNatural').textContent = D.tituloNatural;
$('tVisita').textContent = D.tituloVisita;
$('introVisita').textContent = D.introVisita;
$('pie').textContent = D.pie;

$('listaMenu').innerHTML = D.bebidas.map(b =>
  `<article class="bebida"><div class="ico" style="background:${esc(b.color)}">${esc(b.icono)}</div>
   <div><h3>${esc(b.nombre)}</h3><p>${esc(b.detalle)}</p></div>
   <div class="precio">${esc(D.moneda)} ${esc(b.precio)}</div></article>`).join('');

$('puntos').innerHTML = D.puntos.map(p =>
  `<div><div class="e">${esc(p.icono)}</div><h3>${esc(p.titulo)}</h3><p>${esc(p.texto)}</p></div>`).join('');

$('datos').innerHTML = [
  ['📍 Dirección', D.direccion + (D.referencia ? '<br><small>' + esc(D.referencia) + '</small>' : '')],
  ['🕒 Horario', D.horario],
  ['📞 Teléfono', D.telefono]
].map(([t, v]) => `<div class="dato"><h3>${t}</h3><p>${t.includes('Dirección') ? esc(D.direccion) + (D.referencia ? '<br><small>' + esc(D.referencia) + '</small>' : '') : esc(v)}</p></div>`).join('');

const mapa = D.enlaceMapa || 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(D.direccion);
$('btnMapa').href = mapa;
$('btnMapa').textContent = D.textoBotonMapa;

$('redes').innerHTML = D.redes.filter(r => r.url).map(r =>
  `<a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.nombre)}</a>`).join('');
</script>
</body>
</html>
